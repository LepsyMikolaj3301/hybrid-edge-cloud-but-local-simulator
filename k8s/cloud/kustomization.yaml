apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cloud
resources:
  - 00-namespace.yaml
  - prometheus-cloud.yaml
  - grafana.yaml
configMapGenerator:
  - name: grafana-dashboards
    files:
      - edge-cloud.json=dashboards/edge-cloud.json
generatorOptions:
  disableNameSuffixHash: true
