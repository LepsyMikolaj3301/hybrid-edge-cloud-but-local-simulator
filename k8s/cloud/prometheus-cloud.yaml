apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-cloud-config
  namespace: cloud
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    storage:
      tsdb:
        out_of_order_time_window: 1h
    scrape_configs:
      - job_name: prometheus-cloud
        static_configs:
          - targets: ["localhost:9090"]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-cloud-data
  namespace: cloud
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-cloud
  namespace: cloud
  labels:
    app: prometheus-cloud
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prometheus-cloud
  template:
    metadata:
      labels:
        app: prometheus-cloud
    spec:
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --web.enable-remote-write-receiver
            - --web.listen-address=:9090
            - --storage.tsdb.retention.time=2d
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet: {path: /-/ready, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /-/healthy, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 300m, memory: 256Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus}
            - {name: data, mountPath: /prometheus}
      volumes:
        - name: config
          configMap:
            name: prometheus-cloud-config
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-cloud-data
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-cloud
  namespace: cloud
spec:
  type: NodePort
  selector:
    app: prometheus-cloud
  ports:
    - name: http
      port: 9090
      targetPort: 9090
      nodePort: 30090
