apiVersion: v1
kind: ConfigMap
metadata:
  name: sensor-sim-env
  namespace: edge
  labels: {app: sensor-sim}
data:
  MQTT_HOST: mosquitto.edge.svc
  MQTT_PORT: "1883"
  SAMPLE_RATE_HZ: "100"
  SIGNAL_FREQ_HZ: "0.5"
  SIGNAL_AMPLITUDE: "1.0"
  NOISE_STD: "0.1"
  ANOMALY_RATE: "0.001"
  ANOMALY_AMPLITUDE: "6.0"
  HTTP_PORT: "8080"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sensor-sim
  namespace: edge
  labels: {app: sensor-sim}
spec:
  replicas: 1
  selector:
    matchLabels: {app: sensor-sim}
  template:
    metadata:
      labels: {app: sensor-sim}
    spec:
      containers:
        - name: sensor-sim
          image: edge-demo/sensor-sim:0.1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: sensor-sim-env}
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: sensor-sim
  namespace: edge
  labels: {app: sensor-sim}
spec:
  type: NodePort
  selector: {app: sensor-sim}
  ports:
    - {name: http, port: 8080, targetPort: 8080, nodePort: 30080}
