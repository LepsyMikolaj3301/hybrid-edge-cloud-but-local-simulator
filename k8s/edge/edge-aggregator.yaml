apiVersion: v1
kind: ConfigMap
metadata:
  name: edge-aggregator-env
  namespace: edge
  labels: {app: edge-aggregator}
data:
  MQTT_HOST: mosquitto.edge.svc
  MQTT_PORT: "1883"
  WINDOW_SECONDS: "10"
  ANOMALY_THRESHOLD: "3.0"
  ALERT_RMS_THRESHOLD: "1.5"
  ALERT_WINDOW_SECONDS: "1"
  METRICS_PORT: "8000"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-aggregator
  namespace: edge
  labels: {app: edge-aggregator}
spec:
  replicas: 1
  selector:
    matchLabels: {app: edge-aggregator}
  template:
    metadata:
      labels: {app: edge-aggregator}
    spec:
      containers:
        - name: edge-aggregator
          image: edge-demo/edge-aggregator:0.1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: edge-aggregator-env}
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: edge-aggregator
  namespace: edge
  labels: {app: edge-aggregator}
spec:
  type: NodePort
  selector: {app: edge-aggregator}
  ports:
    - {name: http, port: 8000, targetPort: 8000, nodePort: 30800}
