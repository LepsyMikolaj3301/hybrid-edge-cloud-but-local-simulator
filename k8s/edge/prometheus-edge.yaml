apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-edge-config
  namespace: edge
  labels: {app: prometheus-edge}
data:
  prometheus.yml: |
    global:
      scrape_interval: 2s
      external_labels:
        site: edge-1
    scrape_configs:
      - job_name: edge-aggregator
        static_configs:
          - targets: ["edge-aggregator.edge.svc:8000"]
      - job_name: prometheus-edge
        static_configs:
          - targets: ["localhost:9090"]
    remote_write:
      - url: http://edge-link.edge.svc:9091/api/v1/write
        queue_config:
          max_backoff: 5s
          batch_send_deadline: 1s
          max_samples_per_send: 500
          capacity: 10000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-edge
  namespace: edge
  labels: {app: prometheus-edge}
spec:
  replicas: 1
  selector:
    matchLabels: {app: prometheus-edge}
  template:
    metadata:
      labels: {app: prometheus-edge}
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          imagePullPolicy: IfNotPresent
          args:
            - --agent
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.agent.path=/data
            - --web.listen-address=:9090
          ports:
            - containerPort: 9090
          readinessProbe:
            httpGet: {path: /-/ready, port: 9090}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /-/healthy, port: 9090}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 200m, memory: 256Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus}
            - {name: data, mountPath: /data}
      volumes:
        - name: config
          configMap: {name: prometheus-edge-config}
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-edge
  namespace: edge
  labels: {app: prometheus-edge}
spec:
  type: ClusterIP
  selector: {app: prometheus-edge}
  ports:
    - {name: http, port: 9090, targetPort: 9090}
