apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-config
  namespace: edge
  labels: {app: mosquitto}
data:
  mosquitto.conf: |
    listener 1883 0.0.0.0
    allow_anonymous true
    persistence false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
  namespace: edge
  labels: {app: mosquitto}
spec:
  replicas: 1
  selector:
    matchLabels: {app: mosquitto}
  template:
    metadata:
      labels: {app: mosquitto}
    spec:
      containers:
        - name: mosquitto
          image: eclipse-mosquitto:2.0.20
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 1883
          readinessProbe:
            tcpSocket: {port: 1883}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: 1883}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
          volumeMounts:
            - {name: config, mountPath: /mosquitto/config/mosquitto.conf, subPath: mosquitto.conf}
      volumes:
        - name: config
          configMap: {name: mosquitto-config}
---
apiVersion: v1
kind: Service
metadata:
  name: mosquitto
  namespace: edge
  labels: {app: mosquitto}
spec:
  type: ClusterIP
  selector: {app: mosquitto}
  ports:
    - {name: mqtt, port: 1883, targetPort: 1883}
